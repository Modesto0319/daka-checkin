<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学 · 信息科技 每日题目打卡</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f4f6f8;
    --card:#fff;
    --ink:#16202c;
    --muted:#6b7787;
    --line:#e6eaef;
    --green:#0f9d58;
    --green-soft:#e9f8f1;
    --green-line:#b7e6d2;
    --amber:#b45309;
    --amber-soft:#fef6e4;
    --amber-line:#f3d9a4;
    --blue:#2f6fed;
    --blue-soft:#eef4ff;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px rgba(16,24,40,.06);
  }
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(1200px 600px at 50% -200px, #e9f3ee 0%, rgba(233,243,238,0) 70%), var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1180px;margin:0 auto;padding:0 20px 44px}

  /* 顶部 */
  .top{padding:26px 0 18px}
  .top-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(145deg,#23b884,#0d8f52);
    box-shadow:0 6px 16px rgba(15,157,88,.28);flex:none;
  }
  .brand h1{font-size:20px;line-height:1.2;margin:0;font-weight:650;letter-spacing:.01em}
  .brand p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
  .today-chip{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#33445a;
    background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;backdrop-filter:blur(6px);box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .today-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(15,157,88,.12)}

  /* 控制区 */
  .controls{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .selectors{display:flex;flex-direction:column;gap:8px}
  .segrow{display:flex;align-items:center;gap:10px}
  .seglabel{font-size:12px;color:var(--muted);flex:none;width:28px;letter-spacing:.04em}
  .tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:14px;box-shadow:var(--shadow)}
  .tab{
    border:0;background:transparent;font:inherit;font-size:14px;color:#3d4a5c;
    padding:9px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:.16s;
  }
  .tab span{font-size:11.5px;color:var(--muted);background:#f1f4f7;border-radius:999px;padding:2px 7px}
  .tab:hover{background:#f5f8f7}
  .tab.active{background:linear-gradient(145deg,#1fb57f,#0d9257);color:#fff;box-shadow:0 4px 12px rgba(15,157,88,.22)}
  .tab.active span{background:rgba(255,255,255,.2);color:#eafff6}

  .weeknav{
    display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:6px;box-shadow:var(--shadow);
  }
  .wbtn{
    border:1px solid transparent;background:#f5f7f9;color:#3d4a5c;width:34px;height:34px;border-radius:9px;
    cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center;transition:.16s;font-family:inherit;
  }
  .wbtn:hover{background:#e9eef2}
  .wbtn:disabled{opacity:.35;cursor:default}
  .weektitle{padding:0 10px;min-width:0;text-align:center}
  .weektitle strong{display:block;font-size:14.5px;font-weight:650;white-space:nowrap}
  .weektitle small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
  .ghostbtn{
    border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;color:#43526a;
    padding:8px 12px;border-radius:9px;cursor:pointer;transition:.16s;white-space:nowrap;
  }
  .ghostbtn:hover{background:#f6f8fa;border-color:#d8dee6}
  .ghostbtn:disabled{opacity:.4;cursor:default}

  /* 统计卡 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px 15px;box-shadow:var(--shadow)}
  .stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .stat-label{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .stat-label::before{content:"";width:6px;height:6px;border-radius:50%;background:#c9d2dd}
  .stat.green .stat-label::before{background:var(--green)}
  .stat.blue .stat-label::before{background:var(--blue)}
  .stat.amber .stat-label::before{background:#e3a008}
  .stat-value{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1.1;margin:10px 0 0}
  .stat-value em{font-style:normal;font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
  .bar{height:6px;border-radius:99px;background:#eef1f4;margin:11px 0 9px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#45c79b,#0f9d58);transition:width .3s ease}
  .stat.amber .bar i{background:linear-gradient(90deg,#f3c979,#e2a218)}
  .stat-foot{font-size:11.5px;color:var(--muted);line-height:1.5}

  /* 表格卡片 */
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid #eff2f5}
  .search{
    flex:1 1 180px;min-width:150px;max-width:250px;position:relative;
  }
  .search input{
    width:100%;font:inherit;font-size:13px;padding:9px 12px 9px 32px;border-radius:10px;
    border:1px solid #e3e8ee;background:#fafbfc;color:var(--ink);outline:none;transition:.16s;
  }
  .search input:focus{border-color:#9fd8bd;background:#fff;box-shadow:0 0 0 3px rgba(15,157,88,.1)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#9aa6b6}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    border:1px solid #e6eaef;background:#fff;font:inherit;font-size:12.5px;color:#4a5769;
    padding:7px 12px;border-radius:999px;cursor:pointer;transition:.16s;white-space:nowrap;
  }
  .chip:hover{background:#f6f8fa}
  .chip.active{background:#eaf7f1;border-color:#b7e6d2;color:#0b7a46;font-weight:600}
  .actions{display:flex;gap:8px;margin-left:auto}
  .btn{
    border:0;font:inherit;font-size:13px;padding:9px 14px;border-radius:10px;cursor:pointer;
    background:linear-gradient(145deg,#1fb57f,#0d9257);color:#fff;font-weight:600;
    box-shadow:0 4px 12px rgba(15,157,88,.2);transition:.16s;white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.04)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#fff;color:#43526a;border:1px solid var(--line);box-shadow:none;font-weight:500}
  .btn.ghost:hover{background:#f6f8fa}

  /* 表格 */
  .tablewrap{max-height:min(66vh,720px);overflow:auto;overscroll-behavior:contain}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  th,td{padding:0;text-align:center;vertical-align:middle}
  thead th{
    position:sticky;top:0;z-index:3;background:#fbfcfd;padding:10px 4px;
    border-bottom:1px solid #e8ecf1;font-weight:600;color:#55637a;font-size:12px;
  }
  thead th.day{min-width:74px}
  thead th.day b{display:block;font-size:12.5px;color:#43526a;font-weight:600}
  thead th.day small{display:block;font-size:11px;color:#93a0b1;font-weight:400;margin-top:3px;letter-spacing:.01em}
  thead th.col-id, thead th.col-name{position:sticky;z-index:5;background:#fbfcfd}
  thead th.col-id{left:0}
  thead th.col-name{left:56px;text-align:left;padding-left:14px}
  thead th.day.is-today{background:#eef7f2}
  thead th.day.is-today b{color:#0b7a46}
  thead th.day.is-today small{color:#3f8f6c}
  thead th .th-today-tag{
    display:inline-block;margin-top:5px;font-size:10px;font-weight:600;color:#fff;
    background:var(--green);border-radius:999px;padding:1px 7px;letter-spacing:.05em;
  }
  th.col-id,td.col-id{width:56px;min-width:56px;max-width:56px;color:#9aa6b6}
  th.col-name,td.col-name{
    width:128px;min-width:128px;text-align:left;padding-left:14px;font-size:13.5px;color:#22303f;
  }
  th.col-progress,td.col-progress{width:132px;min-width:132px;border-left:1px solid #e3e9ef}

  tbody td.col-id, tbody td.col-name{position:sticky;z-index:1;background:#fff}
  tbody td.col-name{left:56px}
  tbody tr:nth-child(even) td.col-id, tbody tr:nth-child(even) td.col-name{background:#f7fafb}
  thead th.day, tbody td.cellwrap, tfoot td:not(.col-id):not(.col-name):not(.col-progress){border-left:1px solid #e3e9ef}
  tbody td{padding:9px 3px;border-bottom:1px solid #e3e9ef}
  tbody tr:nth-child(even) td{background:#f7fafb}
  tbody tr:hover td{background:#f5f9f7}
  tbody tr:hover td.col-id, tbody tr:hover td.col-name{background:#f2f8f5}
  tbody tr.is-full td.col-name{font-weight:600}

  td.cellwrap{padding:7px 3px}
  td.cellwrap.is-today{box-shadow:inset 0 0 0 999px rgba(15,157,88,.035)}
  .cell{
    width:32px;height:32px;border-radius:10px;border:1.5px dashed #e2e8ef;background:#fff;
    display:inline-grid;place-items:center;cursor:pointer;padding:0;transition:.15s;
    color:#8d9aab;font-size:11.5px;font-weight:600;font-family:inherit;
  }
  .cell:hover{border-color:#a9dcc3;background:#f6fcf9;transform:scale(1.04)}
  .cell[data-state="1"]{background:var(--green);border:1.5px solid var(--green);color:#fff;box-shadow:0 0 0 3px rgba(15,157,88,.16),0 3px 10px rgba(15,157,88,.38)}
  .cell[data-state="1"] svg{width:18px;height:18px}
  .cell[data-state="1"]:hover{background:#0d8a4f;border-color:#0d8a4f}
  .cell[data-state="2"]{background:var(--amber-soft);border:1.5px solid var(--amber-line);color:var(--amber);font-weight:600}
  .cell:active{transform:scale(.96)}

  .prog{display:flex;align-items:center;gap:8px;justify-content:center}
  .pnum{font-variant-numeric:tabular-nums;font-size:12.5px;color:#43526a;width:30px;text-align:right}
  .pbar{flex:1;max-width:58px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
  .pbar i{display:block;height:100%;border-radius:99px;background:#cfd8e3;transition:width .2s}
  tr.is-full .pbar i{background:linear-gradient(90deg,#45c79b,#0f9d58)}
  tr.is-full .pnum{color:#0b7a46;font-weight:650}
  .full-badge{
    display:none;font-size:10px;font-weight:600;color:#0b7a46;background:#e9f8f1;border:1px solid #c4ebd8;
    border-radius:999px;padding:1px 6px;margin-left:7px;vertical-align:1px;
  }
  tr.is-full .full-badge{display:inline-block}

  tfoot td{
    position:sticky;bottom:0;z-index:2;background:#fbfcfd;border-top:1px solid #e8ecf1;
    padding:10px 4px;font-size:11.5px;color:var(--muted);font-weight:500;
  }
  tfoot td.col-name{background:#fbfcfd;color:#43526a;font-weight:600}
  tfoot td.col-id, tfoot td.col-name{position:sticky;z-index:3}
  tfoot td.col-id{left:0}
  tfoot td.col-name{left:56px}
  tfoot .sumval{display:block;font-size:13px;color:#33445a;font-weight:600;font-variant-numeric:tabular-nums}
  tfoot .sumval.dim{color:#a3b0c1}
  .empty{padding:52px 0;text-align:center;color:var(--muted);font-size:13px}

  .legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid #eff2f5;background:#fcfdfd}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .dotmark{width:16px;height:16px;border-radius:5px;display:inline-grid;place-items:center;border:1.5px solid #e2e8ef;background:#fff;color:#8d9aab;font-size:9.5px;font-weight:600}
  .dotmark.ok{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0 0 2.5px rgba(15,157,88,.16)}
  .dotmark.leave{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
  .legend .tip{margin-left:auto;font-size:11.5px;color:#a3b0c1}
  .save-hint{font-size:11.5px;color:#93a0b1;white-space:nowrap;transition:.3s}
  .cloudbtn{display:inline-flex;align-items:center;gap:7px}
  .cloud-dot{width:7px;height:7px;border-radius:50%;background:#c3ccd7;flex:none;transition:.2s}
  .cloud-dot.sync{background:#e2a218;box-shadow:0 0 0 3px rgba(226,162,24,.14)}
  .cloud-dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(15,157,88,.14)}
  .cloud-dot.err{background:#dc5a5a;box-shadow:0 0 0 3px rgba(220,90,90,.14)}

  /* 弹窗 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(18,28,40,.45);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);
  }
  .modal-mask[hidden]{display:none!important}
  .modal{
    width:100%;max-width:520px;background:#fff;border-radius:18px;padding:22px 24px 20px;
    box-shadow:0 24px 60px rgba(16,24,40,.24);max-height:calc(100vh - 40px);overflow:auto;
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .modal-head h2{margin:0;font-size:17px;font-weight:650}
  .modal-close{
    border:0;background:#f4f6f8;color:#6b7787;width:30px;height:30px;border-radius:9px;
    font-size:19px;line-height:1;cursor:pointer;font-family:inherit;
  }
  .modal-close:hover{background:#e9eef2;color:#33445a}
  .modal-desc{margin:12px 0 18px;font-size:12.5px;line-height:1.7;color:var(--muted)}
  .field{display:block;margin-bottom:13px}
  .field span{display:block;font-size:12.5px;color:#43526a;margin-bottom:6px;font-weight:500}
  .field input{
    width:100%;font:inherit;font-size:13px;padding:10px 12px;border-radius:10px;
    border:1px solid #e3e8ee;background:#fafbfc;outline:none;transition:.16s;
  }
  .field input:focus{border-color:#9fd8bd;background:#fff;box-shadow:0 0 0 3px rgba(15,157,88,.1)}
  .field small{display:block;font-size:11.5px;color:#93a0b1;margin-top:5px;line-height:1.6}
  .modal-status{min-height:18px;font-size:12px;color:#c2410c;line-height:1.6;margin:2px 0 12px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}
  .modal-actions .btn,.modal-actions .ghostbtn{min-width:96px}
  @media (max-width:520px){
    .modal{padding:18px}
    .modal-actions{flex-direction:column-reverse}
    .modal-actions .btn,.modal-actions .ghostbtn{width:100%}
  }

  @media (max-width:900px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .page{padding:0 14px 36px}
  }
  @media (max-width:700px){
    .controls{gap:10px}
    .selectors{width:100%}
    .segrow .tabs{flex:1}
    .segrow .tab{flex:1;justify-content:center;padding:9px 10px}
    .weeknav{width:100%;justify-content:space-between}
    .weektitle{flex:1}
    .toolbar{padding:12px}
    .search{max-width:none;flex:1 1 100%}
    .actions{margin-left:0;width:100%}
    .actions .btn, .actions .ghostbtn{flex:1}
    .stat{padding:14px}
    .stat-value{font-size:28px}
    th.col-name,td.col-name{width:96px;min-width:96px;padding-left:10px;font-size:13px}
    th.col-progress,td.col-progress{width:104px;min-width:104px}
  }
  @media print{
    .top,.controls,.toolbar,.legend{display:none}
    .tablewrap{max-height:none;overflow:visible}
    .card{box-shadow:none}
    .stat{box-shadow:none}
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div>
          <h1>每日题目打卡</h1>
          <p>数学 · 信息科技 · 每周五天 · 点击格子即可打卡</p>
        </div>
      </div>
      <div class="today-chip"><span class="dot"></span><span id="todayText"></span></div>
    </div>
  </header>

  <div class="controls">
    <div class="selectors">
      <div class="segrow">
        <span class="seglabel">班级</span>
        <div class="tabs" id="tabs"></div>
      </div>
      <div class="segrow">
        <span class="seglabel">学科</span>
        <div class="tabs" id="subjectTabs"></div>
      </div>
    </div>
    <div class="weeknav">
      <button class="wbtn" id="prevWeek" title="上一周">‹</button>
      <div class="weektitle">
        <strong id="weekRange"></strong>
        <small id="weekSub"></small>
      </div>
      <button class="wbtn" id="nextWeek" title="下一周">›</button>
      <button class="ghostbtn" id="thisWeek">回到本周</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜索学生姓名" autocomplete="off">
      </div>
      <div class="chips" id="chips">
        <button class="chip active" data-filter="all">全部</button>
        <button class="chip" data-filter="unfull">本周未满勤</button>
        <button class="chip" data-filter="today">今日未打卡</button>
      </div>
      <div class="actions">
        <button class="ghostbtn cloudbtn" id="cloudBtn" title="云同步设置">
          <span class="cloud-dot" id="cloudDot"></span><span id="cloudText">本地模式</span>
        </button>
        <button class="btn" id="fillAll">全部打卡</button>
        <button class="btn ghost" id="clearAll">清空本周</button>
        <button class="btn ghost" id="exportBtn">导出 CSV</button>
        <button class="btn ghost" id="exportAllBtn" title="导出该班级全部周次的历史记录">导出全部历史</button>
      </div>
    </div>
    <div class="tablewrap">
      <table id="table">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </div>
    <div class="legend">
      <span><i class="dotmark ok">✓</i>已打卡</span>
      <span><i class="dotmark leave">假</i>请假（不计入应打卡）</span>
      <span><i class="dotmark"></i>未打卡</span>
      <span class="tip">点击格子依次切换：未打卡 → 已打卡 → 请假</span>
      <span class="save-hint" id="saveHint"></span>
    </div>
  </div>

  <div class="modal-mask" id="cloudModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>云同步设置</h2>
        <button class="modal-close" id="cloudClose" title="关闭">×</button>
      </div>
      <p class="modal-desc">
        填写同一个 Supabase 项目的地址和 anon public 密钥后，所有打开本页面且配置一致的人会共用一份打卡数据（每 15 秒自动同步）。
        首次使用请先在 Supabase 控制台的 SQL Editor 中执行初始化脚本。
      </p>
      <label class="field">
        <span>项目地址</span>
        <input id="cfgUrl" placeholder="https://xxxx.supabase.co" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>anon public 密钥</span>
        <input id="cfgKey" placeholder="eyJhbGciOiJIUzI1NiIs..." autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>共享空间码</span>
        <input id="cfgSpace" placeholder="例如 class2026" autocomplete="off" spellcheck="false">
        <small>空间码相同的人共享同一份数据，可用它区分不同学校或年级。</small>
      </label>
      <div class="modal-status" id="modalStatus"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="cloudClear">清除配置</button>
        <button class="btn" id="cloudSave">保存并连接</button>
      </div>
    </div>
  </div>
</div>

<script>
const CHECK_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const WEEK_LABELS = ['周一','周二','周三','周四','周五'];
const STATE_NAMES = ['未打卡','已打卡','请假'];

const CLASSES = [
  {
    key: '72', name: '七2班',
    students: ['王雨涵','杨宇涵','吴林伟','严嘉懿','李定圆','雷佳豪','张文彩','郑宛心','封梦馨','吴俊峰',
      '刘锦浩','严沛菡','王骏霖','陈梓榆','侯依兰','顾浩宇','晏诗钰','赵芝航','周世然','何明叡',
      '马恩睿','李骏辰','刘媛媛','王文宏','马旗麟','胡浩杰','王艺沄','王皓宇','郑致远','陈清松',
      '刘珂岐','何思怡','罗长晟','陈浩鑫','李翌铭','殷辰嘉睿','杨欣雨','陈奕航']
  },
  {
    key: '82', name: '八2班',
    students: ['王御丞','王极鑫','刘保健','胡嘉鑫','张文博','俞昊然','左宇宇','杨俊熠','杨浦鑫','杨雅淇',
      '黄家炜','付继博','唐耀志','曾意美','刘登权','杨瑞瑶','叶雨涵','刘彦希','李林洋','唐乐凌',
      '胡宇杰','涂辰骏','刘灿毅','谭邵鈺','夏凯鑫','赵志政','周帅洋','胡郭吉星','张宇钊','邵谨堃',
      '杨唐铭晨','陆玉平','谢可欣','杨竣然','汪子钦','周子淳','吴瑞瑶','刘靖湫','吕佳杰','龚靖元',
      '田翌辰','谢学程','田承昊','赵伟杰']
  }
];

const SUBJECTS = [
  { key: 'math', name: '数学' },
  { key: 'it', name: '信息科技' }
];

const view = { classKey: '72', subject: 'math', offset: 0, query: '', filter: 'all' };
const STORE_KEY = 'qmq_daka_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { store = {}; }

/* 兼容旧版数据：旧键为「班级|周起始」，统一迁到数学学科；旧七1班归为八2班 */
(function migrateStore() {
  const out = {};
  Object.keys(store).forEach(k => {
    const parts = k.split('|');
    if (parts.length === 2) {
      const cls = parts[0] === '71' ? '82' : parts[0];
      out['math|' + cls + '|' + parts[1]] = store[k];
    } else {
      out[k] = store[k];
    }
  });
  store = out;
})();

const pad2 = n => (n < 10 ? '0' + n : '' + n);
const iso = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const mondayOf = base => {
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
};
const addDays = (d, n) => {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
};
const isSameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const cnWeekday = d => '星期' + '日一二三四五六'.charAt(d.getDay());
const monthDay = d => (d.getMonth() + 1) + '月' + d.getDate() + '日';

function isoWeekNumber(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  const fDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - fDayNum + 3);
  return 1 + Math.round((t - firstThursday) / 604800000);
}

const TODAY = new Date();
const THIS_MONDAY = mondayOf(TODAY);
const TODAY_IDX = (() => {
  const diff = Math.round((new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()) - THIS_MONDAY) / 86400000);
  return diff >= 0 && diff <= 4 ? diff : -1;
})();

const currentClass = () => CLASSES.find(c => c.key === view.classKey);
const currentSubject = () => SUBJECTS.find(s => s.key === view.subject);
const weekStart = () => addDays(THIS_MONDAY, view.offset * 7);
const isCurrentWeek = () => view.offset === 0;

function dataKey() { return view.subject + '|' + view.classKey + '|' + iso(weekStart()); }
function getDays() {
  const cls = currentClass();
  const k = dataKey();
  if (!store[k]) store[k] = {};
  const map = store[k];
  return cls.students.map((_, i) => map[i] || (map[i] = [0, 0, 0, 0, 0]));
}
function persistLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* 隐私模式下忽略 */ }
}
function save() {
  persistLocal();
  const hint = document.getElementById('saveHint');
  const t = new Date();
  hint.textContent = '已保存 ' + pad2(t.getHours()) + ':' + pad2(t.getMinutes());
  clearTimeout(save._timer);
  save._timer = setTimeout(() => { hint.textContent = ''; }, 2500);
}

/* ---------- 云同步（Supabase） ---------- */
const CLOUD_CFG_KEY = 'qmq_cloud_cfg';
const CLOUD_DEFAULT = {
  url: 'https://yqtlioeevznltfhhjtll.supabase.co',
  key: 'sb_publishable_8l-B8P9kMW0jbJn_Y0e-mQ_z4lsktnP',
  space: 'qmq2026'
};
let cloudCfg = Object.assign({}, CLOUD_DEFAULT);
try {
  const saved = JSON.parse(localStorage.getItem(CLOUD_CFG_KEY) || 'null');
  if (saved) cloudCfg = Object.assign({}, CLOUD_DEFAULT, saved);
} catch (e) { /* 忽略 */ }

const cloudState = { polling: false, timer: null };
const recentEdits = {};
const cloudConfigured = () => !!(cloudCfg.url && cloudCfg.key && cloudCfg.space);
const urlEnc = v => encodeURIComponent(v);
const sameArr = (a, b) => {
  for (let i = 0; i < 5; i++) if ((a[i] || 0) !== (b[i] || 0)) return false;
  return true;
};

function setCloudStatus(state, text) {
  const dot = document.getElementById('cloudDot');
  const label = document.getElementById('cloudText');
  if (dot) dot.className = 'cloud-dot' + (state === 'local' ? '' : ' ' + state);
  if (label) label.textContent = text;
}
function clockText() {
  const t = new Date();
  return pad2(t.getHours()) + ':' + pad2(t.getMinutes());
}
function normDays(v) {
  let arr;
  if (Array.isArray(v)) arr = v.map(Number);
  else if (typeof v === 'string') arr = v.replace(/[{}]/g, '').split(',').map(Number);
  else arr = [0, 0, 0, 0, 0];
  const out = [0, 0, 0, 0, 0];
  for (let i = 0; i < 5; i++) out[i] = arr[i] === 1 || arr[i] === 2 ? arr[i] : 0;
  return out;
}

async function sbFetch(path, opts) {
  const res = await fetch(cloudCfg.url.replace(/\/+$/, '') + '/rest/v1/' + path, Object.assign({}, opts, {
    headers: Object.assign({
      'apikey': cloudCfg.key,
      'Authorization': 'Bearer ' + cloudCfg.key,
      'Content-Type': 'application/json'
    }, (opts && opts.headers) || {})
  }));
  if (!res.ok) {
    const msg = await res.text().catch(() => '');
    throw new Error('HTTP ' + res.status + (msg ? ' · ' + msg.slice(0, 100) : ''));
  }
  const ct = res.headers.get('content-type') || '';
  return ct.indexOf('json') >= 0 ? res.json() : res.text();
}

async function cloudUpsert(rows) {
  if (!rows.length) return;
  const q = 'daka_records?on_conflict=space,class_key,subject,week_start,student_index';
  await sbFetch(q, {
    method: 'POST',
    headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify(rows)
  });
}

function cloudPushIndices(indices) {
  if (!cloudConfigured() || !indices.length) return;
  const clsKey = view.classKey, sub = view.subject, wk = iso(weekStart());
  const days = getDays();
  indices.forEach(i => { recentEdits[sub + '|' + clsKey + '|' + wk + '#' + i] = Date.now(); });
  const rows = indices.map(i => ({
    space: cloudCfg.space, class_key: clsKey, subject: sub,
    week_start: wk, student_index: i, days: days[i].slice()
  }));
  setCloudStatus('sync', '同步中…');
  cloudUpsert(rows)
    .then(() => setCloudStatus('ok', '已同步 ' + clockText()))
    .catch(err => {
      const msg = String((err && err.message) || '');
      setCloudStatus('err', msg.indexOf('PGRST205') >= 0 ? '请先建表' : '同步失败');
    });
}

async function cloudFetchView() {
  const wk = iso(weekStart());
  const q = 'daka_records?select=student_index,days&space=eq.' + urlEnc(cloudCfg.space) +
    '&class_key=eq.' + urlEnc(view.classKey) + '&subject=eq.' + urlEnc(view.subject) +
    '&week_start=eq.' + urlEnc(wk) + '&limit=1000';
  return sbFetch(q);
}

/* 以云端数据为准同步当前班级/学科/周次；云端为空时把本地缓存上传 */
async function cloudSyncView(pushIfEmpty) {
  if (!cloudConfigured()) { setCloudStatus('local', '本地模式'); return; }
  setCloudStatus('sync', '同步中…');
  const sub = view.subject, clsKey = view.classKey, wk = iso(weekStart());
  const key = sub + '|' + clsKey + '|' + wk;
  try {
    const rows = await cloudFetchView();
    const current = store[key] || {};
    const hasLocal = currentClass().students.some((_, i) => (current[i] || []).some(v => v));
    if (pushIfEmpty && rows.length === 0 && hasLocal) {
      const indices = currentClass().students.map((_, i) => i).filter(i => (current[i] || []).some(v => v));
      await cloudUpsert(indices.map(i => ({
        space: cloudCfg.space, class_key: clsKey, subject: sub,
        week_start: wk, student_index: i, days: current[i].slice()
      })));
      setCloudStatus('ok', '已同步 ' + clockText());
      return;
    }
    const grid = {};
    const cloudIdx = {};
    let changed = false;
    rows.forEach(r => {
      const i = +r.student_index;
      cloudIdx[i] = 1;
      grid[i] = normDays(r.days);
      if (!sameArr(current[i], grid[i])) changed = true;
    });
    /* 云端没有但本地非零的行，说明被别人清空了 */
    Object.keys(current).forEach(i => {
      if (cloudIdx[i] || !(current[i] || []).some(v => v)) return;
      const k = key + '#' + i;
      if (recentEdits[k] && Date.now() - recentEdits[k] < 8000) return;
      changed = true;
    });
    /* 刚刚点击、还没同步上去的格子保留本地值 */
    Object.keys(recentEdits).forEach(k => {
      if (k.indexOf(key + '#') !== 0) return;
      if (Date.now() - recentEdits[k] >= 8000) return;
      const i = +k.slice((key + '#').length);
      if (current[i]) grid[i] = current[i];
    });
    if (changed) {
      store[key] = grid;
      persistLocal();
      renderStats();
      renderTable();
    }
    setCloudStatus('ok', '已同步 ' + clockText());
  } catch (e) {
    const msg = String((e && e.message) || '');
    setCloudStatus('err', msg.indexOf('PGRST205') >= 0 ? '请先建表' : '同步失败');
  }
}

async function cloudClearView() {
  if (!cloudConfigured()) return;
  const sub = view.subject, clsKey = view.classKey, wk = iso(weekStart());
  setCloudStatus('sync', '同步中…');
  try {
    await sbFetch('daka_records?space=eq.' + urlEnc(cloudCfg.space) + '&class_key=eq.' + urlEnc(clsKey) +
      '&subject=eq.' + urlEnc(sub) + '&week_start=eq.' + urlEnc(wk), { method: 'DELETE' });
    setCloudStatus('ok', '已同步 ' + clockText());
  } catch (e) {
    setCloudStatus('err', '同步失败');
  }
}

function startPolling() {
  if (cloudState.polling) return;
  cloudState.polling = true;
  cloudState.timer = setInterval(() => {
    if (document.hidden) return;
    cloudSyncView(false);
  }, 15000);
}
function stopPolling() {
  cloudState.polling = false;
  if (cloudState.timer) clearInterval(cloudState.timer);
  cloudState.timer = null;
}

/* ---------- 渲染 ---------- */
function renderTabs() {
  document.getElementById('tabs').innerHTML = CLASSES.map(c =>
    `<button class="tab${c.key === view.classKey ? ' active' : ''}" data-key="${c.key}">${c.name}<span>${c.students.length}人</span></button>`
  ).join('');
  document.getElementById('subjectTabs').innerHTML = SUBJECTS.map(s =>
    `<button class="tab${s.key === view.subject ? ' active' : ''}" data-key="${s.key}">${s.name}</button>`
  ).join('');
}

function renderWeek() {
  const start = weekStart();
  const end = addDays(start, 4);
  document.getElementById('weekRange').textContent = monthDay(start) + ' – ' + monthDay(end);
  const weekNo = isoWeekNumber(start);
  document.getElementById('weekSub').textContent =
    start.getFullYear() + '年 · 第' + weekNo + '周 · ' + currentSubject().name + (isCurrentWeek() ? ' · 本周' : '');
  document.getElementById('thisWeek').disabled = isCurrentWeek();
}

function renderStats() {
  const days = getDays();
  const total = days.length;
  let done = 0, leave = 0;
  days.forEach(arr => arr.forEach(v => { if (v === 1) done++; else if (v === 2) leave++; }));
  const required = total * 5 - leave;
  const rate = required > 0 ? Math.round(done / required * 100) : 0;
  const fullCount = days.filter(arr => arr.every(v => v === 1)).length;
  const tIdx = isCurrentWeek() ? TODAY_IDX : -1;
  const todayDone = tIdx >= 0 ? days.filter(arr => arr[tIdx] === 1).length : 0;

  document.getElementById('stats').innerHTML = `
    <div class="stat green">
      <div class="stat-top"><span class="stat-label">本周打卡率</span><span style="font-size:11.5px;color:#8b98a8">目标 100%</span></div>
      <div class="stat-value">${rate}<em>%</em></div>
      <div class="bar"><i style="width:${rate}%"></i></div>
      <div class="stat-foot">已打卡 ${done} 人次 / 应打卡 ${required} 人次</div>
    </div>
    <div class="stat blue">
      <div class="stat-top"><span class="stat-label">全勤人数</span></div>
      <div class="stat-value">${fullCount}<em>/ ${total} 人</em></div>
      <div class="bar"><i style="width:${total ? Math.round(fullCount / total * 100) : 0}%"></i></div>
      <div class="stat-foot">周一至周五全部打卡</div>
    </div>
    <div class="stat green">
      <div class="stat-top"><span class="stat-label">今日完成</span></div>
      <div class="stat-value">${tIdx >= 0 ? todayDone : '—'}<em>${tIdx >= 0 ? '/ ' + total + ' 人' : ''}</em></div>
      <div class="bar"><i style="width:${tIdx >= 0 && total ? Math.round(todayDone / total * 100) : 0}%"></i></div>
      <div class="stat-foot">${tIdx >= 0 ? '今天 ' + WEEK_LABELS[tIdx] + ' ' + monthDay(addDays(weekStart(), tIdx)) : '当前查看的不是本周'}</div>
    </div>
    <div class="stat amber">
      <div class="stat-top"><span class="stat-label">请假人次</span></div>
      <div class="stat-value">${leave}<em>人次</em></div>
      <div class="bar"><i style="width:${required > 0 ? Math.min(100, Math.round(leave / (total * 5) * 100)) : 0}%"></i></div>
      <div class="stat-foot">请假不计入应打卡人次</div>
    </div>`;
}

function renderHead() {
  const start = weekStart();
  const tIdx = isCurrentWeek() ? TODAY_IDX : -1;
  let html = '<tr><th class="col-id">序号</th><th class="col-name">姓名</th>';
  for (let d = 0; d < 5; d++) {
    const dt = addDays(start, d);
    const today = d === tIdx;
    html += `<th class="day${today ? ' is-today' : ''}"><b>${WEEK_LABELS[d]}</b><small>${monthDay(dt)}</small>${today ? '<span class="th-today-tag">今天</span>' : ''}</th>`;
  }
  html += '<th class="col-progress">本周完成</th></tr>';
  document.getElementById('thead').innerHTML = html;
}

function renderTable() {
  const cls = currentClass();
  const days = getDays();
  const tIdx = isCurrentWeek() ? TODAY_IDX : -1;
  const q = view.query.trim().toLowerCase();
  const rows = [];

  cls.students.forEach((name, i) => {
    if (q && !name.toLowerCase().includes(q)) return;
    const arr = days[i];
    const done = arr.filter(v => v === 1).length;
    if (view.filter === 'unfull' && done === 5) return;
    if (view.filter === 'today' && tIdx >= 0 && arr[tIdx] === 1) return;
    if (view.filter === 'today' && tIdx === -1) return;

    let cells = '';
    for (let d = 0; d < 5; d++) {
      const st = arr[d];
      const todayCls = d === tIdx ? ' is-today' : '';
      cells += `<td class="cellwrap${todayCls}"><button class="cell" data-i="${i}" data-d="${d}" data-state="${st}" title="${name} · ${WEEK_LABELS[d]} ${monthDay(addDays(weekStart(), d))} · ${STATE_NAMES[st]}">${st === 1 ? CHECK_SVG : st === 2 ? '假' : ''}</button></td>`;
    }
    rows.push(`<tr data-i="${i}" class="${done === 5 ? 'is-full' : ''}">
      <td class="col-id">${i + 1}</td>
      <td class="col-name">${name}<span class="full-badge">全勤</span></td>
      ${cells}
      <td class="col-progress"><div class="prog"><span class="pnum">${done}/5</span><span class="pbar"><i style="width:${done / 5 * 100}%"></i></span></div></td>
    </tr>`);
  });

  document.getElementById('tbody').innerHTML = rows.length ? rows.join('') :
    `<tr><td colspan="8" class="empty">${view.filter === 'today' && !isCurrentWeek() ? '当前查看的不是本周，没有“今日”数据' : '没有符合条件的学生'}</td></tr>`;
  renderFoot();
}

function renderFoot() {
  const days = getDays();
  const tIdx = isCurrentWeek() ? TODAY_IDX : -1;
  let html = '<tr><td class="col-id">—</td><td class="col-name">每日完成</td>';
  for (let d = 0; d < 5; d++) {
    const done = days.filter(arr => arr[d] === 1).length;
    const leave = days.filter(arr => arr[d] === 2).length;
    html += `<td><span class="sumval${done ? '' : ' dim'}">${done} 人</span>${leave ? `<span style="font-size:10.5px;color:#b45309">请假 ${leave}</span>` : ''}</td>`;
  }
  const totalDone = days.reduce((s, arr) => s + arr.filter(v => v === 1).length, 0);
  html += `<td class="col-progress"><span class="sumval">${totalDone} 人次</span></td></tr>`;
  document.getElementById('tfoot').innerHTML = html;
}

function renderAll() {
  renderTabs();
  renderWeek();
  renderStats();
  renderHead();
  renderTable();
}

/* 单元格局部刷新，避免整表重绘 */
function updateRow(i) {
  const arr = getDays()[i];
  const done = arr.filter(v => v === 1).length;
  const tr = document.querySelector('#tbody tr[data-i="' + i + '"]');
  if (!tr) return;
  tr.classList.toggle('is-full', done === 5);
  const num = tr.querySelector('.pnum');
  if (num) num.textContent = done + '/5';
  const bar = tr.querySelector('.pbar i');
  if (bar) bar.style.width = (done / 5 * 100) + '%';
}

/* ---------- 事件 ---------- */
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  view.classKey = btn.dataset.key;
  view.query = '';
  document.getElementById('search').value = '';
  renderAll();
  cloudSyncView(true);
});

document.getElementById('subjectTabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  view.subject = btn.dataset.key;
  renderAll();
  cloudSyncView(true);
});

document.getElementById('prevWeek').addEventListener('click', () => { view.offset--; renderAll(); cloudSyncView(true); });
document.getElementById('nextWeek').addEventListener('click', () => { view.offset++; renderAll(); cloudSyncView(true); });
document.getElementById('thisWeek').addEventListener('click', () => { view.offset = 0; renderAll(); cloudSyncView(true); });

document.getElementById('search').addEventListener('input', e => {
  view.query = e.target.value;
  renderTable();
});

document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  view.filter = chip.dataset.filter;
  document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('active', c === chip));
  renderTable();
});

document.getElementById('tbody').addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  const i = +cell.dataset.i, d = +cell.dataset.d;
  const arr = getDays()[i];
  arr[d] = (arr[d] + 1) % 3;
  const st = arr[d];
  cell.dataset.state = st;
  cell.innerHTML = st === 1 ? CHECK_SVG : st === 2 ? '假' : '';
  cell.title = currentClass().students[i] + ' · ' + WEEK_LABELS[d] + ' ' + monthDay(addDays(weekStart(), d)) + ' · ' + STATE_NAMES[st];
  save();
  cloudPushIndices([i]);
  renderStats();
  if (view.filter !== 'all') renderTable(); else { updateRow(i); renderFoot(); }
});

document.getElementById('fillAll').addEventListener('click', () => {
  const cls = currentClass();
  const subject = currentSubject();
  if (!confirm('将把「' + cls.name + ' · ' + subject.name + '」本周周一到周五全部标记为已打卡，确定吗？')) return;
  const map = store[dataKey()] || (store[dataKey()] = {});
  cls.students.forEach((_, i) => { map[i] = [1, 1, 1, 1, 1]; });
  save();
  cloudPushIndices(cls.students.map((_, i) => i));
  renderStats();
  renderTable();
});

document.getElementById('clearAll').addEventListener('click', () => {
  const cls = currentClass();
  const subject = currentSubject();
  if (!confirm('确定清空「' + cls.name + ' · ' + subject.name + '」本周（' + document.getElementById('weekRange').textContent + '）的全部打卡记录吗？')) return;
  delete store[dataKey()];
  save();
  cloudClearView();
  renderStats();
  renderTable();
});

function saveCSV(text, filename) {
  const blob = new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const cls = currentClass();
  const subject = currentSubject();
  const days = getDays();
  const start = weekStart();
  const head = ['学科', '班级', '序号', '姓名'];
  for (let d = 0; d < 5; d++) head.push(WEEK_LABELS[d] + '(' + monthDay(addDays(start, d)) + ')');
  head.push('本周完成', '打卡率');
  const lines = [head.join(',')];
  cls.students.forEach((name, i) => {
    const arr = days[i];
    const row = [subject.name, cls.name, i + 1, name];
    arr.forEach(v => row.push(STATE_NAMES[v]));
    const done = arr.filter(v => v === 1).length;
    row.push(done + '/5', Math.round(done / 5 * 100) + '%');
    lines.push(row.join(','));
  });
  saveCSV(lines.join('\r\n'), cls.name + '_' + subject.name + '_' + iso(start) + '_打卡记录.csv');
});

/* ---------- 导出全部历史 ---------- */
async function fetchAllCloudRows(clsKey, subKey) {
  const out = [];
  let from = 0;
  const base = 'daka_records?select=week_start,student_index,days&space=eq.' + urlEnc(cloudCfg.space) +
    '&class_key=eq.' + urlEnc(clsKey) + '&subject=eq.' + urlEnc(subKey) +
    '&order=week_start.asc&limit=1000';
  while (from <= 20000) {
    const rows = await sbFetch(base + '&offset=' + from);
    for (let i = 0; i < rows.length; i++) out.push(rows[i]);
    if (rows.length < 1000) break;
    from += 1000;
  }
  return out;
}

async function collectHistory(cls, subject) {
  const prefix = subject.key + '|' + cls.key + '|';
  const grids = {};
  Object.keys(store).forEach(k => {
    if (k.indexOf(prefix) === 0) grids[k.slice(prefix.length)] = store[k];
  });
  let cloudOk = true;
  if (cloudConfigured()) {
    try {
      const rows = await fetchAllCloudRows(cls.key, subject.key);
      rows.forEach(r => {
        const wk = String(r.week_start);
        if (!grids[wk]) grids[wk] = {};
        grids[wk][+r.student_index] = normDays(r.days);
      });
    } catch (e) {
      cloudOk = false;
    }
  }
  return { grids: grids, cloudOk: cloudOk };
}

document.getElementById('exportAllBtn').addEventListener('click', async () => {
  const cls = currentClass();
  const subject = currentSubject();
  const hint = document.getElementById('saveHint');
  hint.textContent = '正在汇总云端历史…';
  const res = await collectHistory(cls, subject);
  const grids = res.grids;
  const weeks = Object.keys(grids).sort();
  if (!weeks.length) {
    hint.textContent = '';
    alert('「' + cls.name + ' · ' + subject.name + '」暂无历史记录可导出' + (res.cloudOk ? '。' : '（云端连接失败，且本地无缓存）。'));
    return;
  }
  const head = ['学科', '班级', '周次(周一)', '序号', '姓名'];
  for (let d = 0; d < 5; d++) head.push(WEEK_LABELS[d]);
  head.push('本周完成');
  const lines = [head.join(',')];
  weeks.forEach(wk => {
    const start = new Date(wk + 'T00:00:00');
    cls.students.forEach((name, i) => {
      const arr = normDays((grids[wk] || {})[i] || [0, 0, 0, 0, 0]);
      const row = [subject.name, cls.name, monthDay(start) + '(' + wk + ')', i + 1, name];
      arr.forEach(v => row.push(STATE_NAMES[v]));
      row.push(arr.filter(v => v === 1).length + '/5');
      lines.push(row.join(','));
    });
  });
  saveCSV(lines.join('\r\n'), cls.name + '_' + subject.name + '_全部历史打卡.csv');
  hint.textContent = '已导出 ' + weeks.length + ' 周' + (res.cloudOk ? '' : '（云端不可用，仅本地）');
  setTimeout(() => { hint.textContent = ''; }, 4000);
});

/* ---------- 云同步设置弹窗 ---------- */
const cloudModal = document.getElementById('cloudModal');

function openCloudModal() {
  document.getElementById('cfgUrl').value = cloudCfg.url;
  document.getElementById('cfgKey').value = cloudCfg.key;
  document.getElementById('cfgSpace').value = cloudCfg.space === 'default' && !cloudCfg.url ? '' : cloudCfg.space;
  document.getElementById('modalStatus').textContent = '';
  cloudModal.hidden = false;
}
function closeCloudModal() { cloudModal.hidden = true; }

document.getElementById('cloudBtn').addEventListener('click', openCloudModal);
document.getElementById('cloudClose').addEventListener('click', closeCloudModal);
cloudModal.addEventListener('click', e => { if (e.target === cloudModal) closeCloudModal(); });

document.getElementById('cloudSave').addEventListener('click', () => {
  const url = document.getElementById('cfgUrl').value.trim().replace(/\/+$/, '');
  const key = document.getElementById('cfgKey').value.trim();
  const space = document.getElementById('cfgSpace').value.trim() || 'default';
  const st = document.getElementById('modalStatus');
  if (!/^https?:\/\/\S+$/.test(url)) {
    st.textContent = '请填写正确的项目地址，例如 https://xxxx.supabase.co';
    return;
  }
  if (!key) { st.textContent = '请填写 anon public 密钥'; return; }
  cloudCfg = { url: url, key: key, space: space };
  try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudCfg)); } catch (e) { /* 忽略 */ }
  closeCloudModal();
  stopPolling();
  cloudSyncView(true).then(startPolling);
});

document.getElementById('cloudClear').addEventListener('click', () => {
  try { localStorage.removeItem(CLOUD_CFG_KEY); } catch (e) { /* 忽略 */ }
  cloudCfg = Object.assign({}, CLOUD_DEFAULT);
  stopPolling();
  setCloudStatus('local', '本地模式');
  closeCloudModal();
});

document.getElementById('todayText').textContent =
  TODAY.getFullYear() + '年' + monthDay(TODAY) + ' ' + cnWeekday(TODAY);
renderAll();
if (cloudConfigured()) {
  setCloudStatus('sync', '连接中…');
  cloudSyncView(true).then(startPolling);
} else {
  setCloudStatus('local', '本地模式');
}
